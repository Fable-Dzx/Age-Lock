name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: age-lock-jars
          path: build/libs/*.jar

  # 每次推送到 main 自动发布滚动 Release（无需手动打标签）
  publish-continuous:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: age-lock-jars
          path: artifacts

      - name: Publish continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          SHA=${GITHUB_SHA:0:7}
          gh release delete continuous --yes --cleanup-tag 2>/dev/null || true
          gh release create continuous artifacts/*.jar \
            --title "Age Lock v${VERSION} - continuous" \
            --notes "Auto build from main@${SHA}. This rolling release is updated on every push to main; use version tags (v1.0.0, v1.1.0, ...) for stable releases."

  # 推送 v* 版本标签时发布稳定版 Release
  publish-tag:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: age-lock-jars
          path: artifacts

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
          generate_release_notes: true
